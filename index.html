{title:'실습실 · 네 개의 방',brief:'심장 단면을 눌러 역할 복습',limit:90,emergency:false,tab:'model',nurse:'선생님, 응급실 근무 전에 심장 모형으로 실습해 볼까요? 네 방을 눌러 역할을 확인해 주세요.',doctor:'심방은 혈액을 받고, 심실은 혈액을 내보내요. 몸의 왼쪽과 화면의 왼쪽이 반대라는 것도 기억합시다.',learn:'심방은 혈액을 받는 방, 심실은 혈액을 심장 밖으로 보내는 방입니다.',qs:[
['심장으로 돌아오는 혈액을 먼저 받는 방은?',['심방','심실','대동맥'],0,'우심방은 온몸에서, 좌심방은 폐에서 돌아온 혈액을 받습니다.'],
['우심실이 내보낸 혈액은 먼저 어디로 갈까요?',['온몸','폐','좌심방'],1,'우심실은 폐동맥을 통해 폐로 혈액을 보냅니다.'],
['좌심실의 근육 벽이 더 두꺼운 까닭은?',['산소를 직접 만들어서','혈액을 저장하기만 해서','온몸으로 혈액을 보내는 데 큰 힘이 필요해서'],2,'좌심실은 온몸으로 혈액을 보내기 위해 높은 압력을 만듭니다.'] ]},
{title:'실습실 · 흐름과 판막',brief:'혈액의 길과 역류 방지 복습',limit:90,emergency:false,tab:'flow',nurse:'이번에는 혈액 한 방울의 길을 따라가 볼까요? 혈액이 뒤로 흐르지 않는 까닭도 설명해 주세요.',doctor:'폐와 온몸을 오가는 두 순환이 이어져 있어요. 판막은 혈액이 거꾸로 흐르는 것을 막아 줍니다.',learn:'판막은 역류를 막습니다. 폐에서 돌아온 혈액은 폐정맥→좌심방→좌심실로 이동합니다.',qs:[
['판막은 어떤 역할을 할까요?',['혈액에 산소를 만든다','혈액의 역류를 막는다','혈액을 심장 밖으로 새게 한다'],1,'판막은 혈액이 거꾸로 흐르는 것을 막는 문 역할을 합니다.'],
['폐에서 산소를 얻은 혈액이 돌아오는 길은?',['대정맥 → 우심방','대동맥 → 좌심실','폐정맥 → 좌심방'],2,'폐정맥에는 산소가 상대적으로 많은 혈액이 흐릅니다.'],
['동맥과 정맥을 구분하는 기준은?',['심장을 기준으로 혈액이 흐르는 방향','혈액이 빨간색인지 파란색인지','산소가 있는지 없는지'],0,'동맥은 심장에서 나가는 혈관, 정맥은 심장으로 들어오는 혈관입니다. 실제 혈액은 모두 붉은 계열입니다.'] ]},
{title:'응급실 · 판막 손상',brief:'좌심실의 혈액이 뒤로 흐른다!',limit:75,emergency:true,tab:'model',nurse:'응급환자 도착! 검사 결과, 좌심실이 수축할 때 혈액 일부가 좌심방으로 되돌아갑니다. 선생님, 치료팀에 정확한 정보를 전달해 주세요!',doctor:'전문 치료팀이 함께합니다. 손상된 구조와 기능을 판단해 치료 목표를 정합시다.',learn:'좌심방과 좌심실 사이 판막은 좌심실 수축 때 혈액이 좌심방으로 역류하는 것을 막습니다.',qs:[
['좌심실 → 좌심방으로 역류합니다. 손상된 구조는?',['좌심방과 좌심실 사이의 판막','대정맥','폐동맥'],0,'좌심방과 좌심실 사이 판막이 제대로 닫히지 않으면 혈액이 좌심방으로 되돌아갈 수 있습니다.'],

function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;if(!audio){audio=new AC();master=audio.createGain();master.gain.value=volume;master.connect(audio.destination);}if(audio.state==='suspended')audio.resume().catch(()=>{sound=false;updateSound();});return true;}catch(e){sound=false;return false;}}
function tone(f,t,d,v){if(!audio||!sound||document.hidden)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.7,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);o.onended=()=>{o.disconnect();g.disconnect();};}
function beat(){if(!sound||!audio||document.hidden)return;const t=audio.currentTime;if(mode==='heart'){tone(95,t,.13,.45);tone(70,t+.22,.11,.32);}else{tone(880,t,.08,.12);}}
function startLoop(){clearInterval(loop);loop=null;if(sound&&getAudio()){beat();loop=setInterval(beat,state.stage>=2 && state.screen==='question'?600:833);}}

</svg><p id="chamberInfo" class="hint" aria-live="polite">심방 2곳과 심실 2곳을 눌러 역할을 확인하세요.</p><div class="anatomyNote">노란 선: 심방과 심실 사이의 판막<br>심실과 동맥 사이에도 판막이 있습니다. 그림은 구조 학습을 위해 단순화했습니다.</div><p class="legend">파랑: 산소가 상대적으로 적음 / 분홍: 산소가 상대적으로 많음. 실제 혈액은 모두 붉은 계열입니다.</p>`;}
function viewer(){const el=document.getElementById('viewer');if(!el)return;
if(state.tab==='echo'||state.tab==='ct'){const echo=state.tab==='echo';el.innerHTML=`<span class="tag">실제 공개 검사 자료 · 정지 사진</span><img class="medical" id="medimage" src="${echo?ECHO_IMG:CT_IMG}" alt="${echo?'정상 심장의 네 방을 보여 주는 실제 초음파 정지 사진':'가슴을 가로로 자른 단면을 보여 주는 실제 CT 사진'}" referrerpolicy="no-referrer"><p id="medstatus" class="loadnote" role="status">사진을 불러오는 중입니다. 연결이 느리면 아래의 관찰 안내나 심장 모형을 먼저 살펴보세요.</p><h3 style="margin-top:15px">${echo?'관찰: 심장 속 빈 공간과 벽':'관찰: 가슴 속 기관의 위치'}</h3><p>${echo?'검은 공간과 그 둘레의 밝은 벽을 찾아보세요. 초음파는 심장 벽과 판막의 움직임을 관찰하는 데 사용합니다. 이곳에는 한 순간의 사진을 표시했습니다.':'CT는 몸속을 얇은 단면으로 보여 줍니다. 가슴 양쪽의 어두운 부분은 공기가 많은 폐이고, 가운데에는 심장과 큰 혈관 등이 있습니다.'}</p><p class="legend">${echo?'검사 각도에 따라 보이는 방향이 달라요. 심장 모형과 위아래·좌우가 같지 않을 수 있습니다.':'이 자료는 폐를 잘 보이게 한 사진입니다. 이 사진만으로 심장 네 방이나 판막 기능을 판단하지 않아요.'}</p><p class="legend">게임 속 환자의 검사 결과가 아닌 학습용 참고 자료입니다.</p><a class="small" href="${echo?ECHO_PAGE:CT_PAGE}" target="_blank" rel="noopener">${echo?'원본 초음파 영상과 출처 보기 ↗':'원본 CT 사진과 출처 보기 ↗'}</a>`;const img=document.getElementById('medimage'),note=document.getElementById('medstatus');const loaded=()=>{note.hidden=true;};const failed=()=>{img.hidden=true;note.hidden=false;note.textContent='인터넷 연결 또는 제공 사이트 제한으로 사진을 불러오지 못했어요. 원본 링크를 열거나 심장 모형 탭에서 계속 학습할 수 있어요.';};img.onload=loaded;img.onerror=failed;if(img.complete){if(img.naturalWidth)loaded();else failed();}return;}
if(state.tab==='model'){el.innerHTML=heartModel();const infos=['우심방: 대정맥을 통해 온몸에서 돌아온 혈액을 받아 우심실로 보냅니다.','좌심방: 폐정맥을 통해 폐에서 돌아온 혈액을 받아 좌심실로 보냅니다.','우심실: 폐동맥을 통해 폐로 혈액을 보냅니다.','좌심실: 대동맥을 통해 온몸으로 혈액을 보냅니다. 근육 벽이 우심실보다 두껍습니다.'];document.querySelectorAll('[data-chamber]').forEach(b=>{const activate=()=>{document.querySelectorAll('[data-chamber]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b));});document.getElementById('chamberInfo').textContent=infos[+b.dataset.chamber];};b.onclick=activate;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate();}};});return;}
el.innerHTML=`<h3>혈액 한 방울을 따라가요</h3><p class="small">온몸에서 출발해 폐와 심장을 지나 돌아옵니다. 한 칸씩 눌러 관찰하세요.</p><div class="flowlist">${route.map((n,i)=>`<span class="${i===state.flow?'on':''}">${i+1}. ${n}${i<route.length-1?' →':''}</span>`).join('')}</div><p class="hint" aria-live="polite">${flowDescription(state.flow)}</p><button id="flowNext" class="primary">${state.flow===10?'처음부터 관찰 ↻':'다음 위치로 →'}</button><p class="legend">폐순환: 우심실 → 폐 → 좌심방<br>온몸순환: 좌심실 → 온몸 → 우심방<br>동맥은 심장에서 나가는 혈관, 정맥은 심장으로 들어오는 혈관입니다.</p>`;document.getElementById('flowNext').onclick=()=>{state.flow=(state.flow+1)%route.length;viewer();};}
function flowDescription(i){return ['온몸의 조직에 산소를 전달한 혈액이 심장으로 돌아갑니다.','대정맥: 온몸에서 심장으로 돌아오는 길입니다.','우심방: 온몸에서 돌아온 혈액을 받습니다.','우심실: 혈액을 폐로 밀어 보냅니다.','폐동맥: 산소가 상대적으로 적은 혈액이 폐로 갑니다.','폐의 모세혈관: 공기에서 산소를 받고 이산화 탄소를 내보냅니다.','폐정맥: 산소가 많아진 혈액이 심장으로 돌아옵니다.','좌심방: 폐에서 돌아온 혈액을 받습니다.','좌심실: 혈액을 온몸으로 힘차게 내보냅니다.','대동맥: 혈액이 온몸으로 나가는 큰 길입니다.','온몸의 모세혈관: 조직에 산소와 영양소 등을 전달합니다. 여행은 다시 이어집니다.'][i];}
function question(){state.screen='question';state.selected=false;const s=stages[state.stage],q=s.qs[state.q];root.innerHTML=header()+gameClock()+`<div class="eyebrow">MISSION 0${state.stage+1} / ${s.title}</div><div class="timeTrack"><div id="timeFill" style="width:${Math.max(0,(state.stageDeadline-Date.now())/(s.limit*1000)*100)}%"></div></div><section class="layout"><div class="story">${cast()}<div class="bubble"><span class="speaker">다온 간호사 → ${esc(state.name)} 의사 · ${state.q+1}/3</span><h2 id="questionTitle" tabindex="-1" style="margin:8px 0 0">${q[0]}</h2></div><p class="small">${s.emergency?'신중하게 판단하세요. 오답은 즉시 미션 실패입니다.':'모형과 자료를 살펴보고 답해요.'} · 관찰 자료는 휴대전화에서 아래에 있습니다.</p><div class="options">${q[1].map((t,i)=>`<button class="option" data-answer="${i}">${String.fromCharCode(65+i)}. ${t}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></div>${study()}</section>`+footer();bindHeader();bindStudy();document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));window.scrollTo(0,0);}
function answer(i){if(state.screen!=='question'||state.selected)return;if(Date.now()>=state.gameDeadline||Date.now()>=state.stageDeadline){tick();return;}state.selected=true;const s=stages[state.stage],q=s.qs[state.q],ok=i===q[2];state.answers.push({stage:state.stage,q:state.q,choice:i,ok:ok});if(!ok&&s.emergency){endStage('dead','오답: '+q[1][i]);return;}document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(+b.dataset.answer===q[2])b.classList.add('correct');else if(+b.dataset.answer===i)b.classList.add('wrong');});if(sound&&audio){tone(ok?660:330,audio.currentTime,.12,.16);if(ok)tone(880,audio.currentTime+.14,.12,.13);}document.getElementById('liveScore').textContent=points();if(state.q===2){endStage(s.emergency?'saved':'complete','미션 완료');return;}document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'retry'}"><b>${ok?'✓ 정확한 판단! +100점':'설명을 읽고 다시 기억해요.'}</b><p>${q[3]}</p><span class="small">정답: ${q[1][q[2]]} · 미션 타이머는 계속 흐릅니다.</span></div><button class="primary" id="next">다음 판단 →</button>`;document.getElementById('next').onclick=()=>{if(Date.now()>=state.stageDeadline||Date.now()>=state.gameDeadline){tick();return;}state.q++;question();};}
function recordStage(status,reason){if(state.records[state.stage])return state.records[state.stage];const s=stages[state.stage],correct=state.answers.filter(a=>a.stage===state.stage&&a.ok).length,remaining=Math.max(0,state.stageDeadline-Date.now()),completed=status==='saved'||status==='complete';const bonus=completed?Math.floor(100*remaining/(s.limit*1000)*(s.emergency?1:correct/3)):0;const r={status,reason,correct,base:correct*100,rescue:status==='saved'?300:0,bonus,score:correct*100+(status==='saved'?300:0)+bonus,elapsed:Math.min(s.limit,Math.max(0,(Date.now()-state.stageStart)/1000))};state.records[state.stage]=r;return r;}
function endStage(status,reason){const r=recordStage(status,reason);state.screen='stageEnd';state.selected=true;const s=stages[state.stage],last=state.answers.filter(a=>a.stage===state.stage).slice(-1)[0];if(sound&&audio){if(status==='dead'){tone(240,audio.currentTime,.8,.1);}else{tone(660,audio.currentTime,.14,.15);tone(880,audio.currentTime+.16,.14,.15);}}root.innerHTML=header()+gameClock()+`<section class="result card"><div class="eyebrow">MISSION 0${state.stage+1} RESULT</div><h1 class="${status==='dead'?'deathTitle':'successTitle'}" style="font-size:34px">${status==='dead'?'환자가 사망했습니다':status==='saved'?'환자를 살렸습니다!':status==='timeout'?'실습 시간이 끝났습니다':'실습 완료!'}</h1><p>${esc(reason)} · 정답 ${r.correct}/3</p><div class="score">+${r.score}<small style="font-size:18px">점</small></div><p class="small">정답 ${r.base} + 구조 ${r.rescue} + 시간 ${r.bonus}</p>${status==='dead'?'<p class="small">게임 속 결과입니다. 틀린 개념을 확인하고 다음 도전에 활용하세요.</p>':''}<div class="bubble doctor"><span class="speaker">${esc(state.name)} 의사 · 핵심 복습</span><p>${s.learn}</p>${last?`<p class="small">마지막 판단 해설: ${s.qs[last.q][3]}</p>`:''}</div><button id="continue" class="primary">${state.stage===3?'최종 점수 확인':'다음 미션 →'}</button><p class="small">전체 타이머가 흐르고 있어요. 다음 미션으로 이동하세요.</p></section>`+footer();bindHeader();document.getElementById('continue').onclick=()=>{if(Date.now()>=state.gameDeadline){tick();return;}if(state.stage===3)results();else{state.stage++;intro();}};window.scrollTo(0,0);}
function resultCode(){const elapsed=Math.min(480,Math.max(0,(state.ended-state.gameStart)/1000));return [state.name,points(),state.records.filter(r=>r&&r.status==='saved').length,elapsed.toFixed(1)].join(' | ');}
function results(expired=false){stopClock();state.screen='results';if(!state.ended)state.ended=Math.min(Date.now(),state.gameDeadline);const correct=state.answers.filter(a=>a.ok).length,saved=state.records.filter(r=>r&&r.status==='saved').length,elapsed=Math.min(480,Math.max(0,(state.ended-state.gameStart)/1000));root.innerHTML=header()+`<section class="result"><div class="card"><div class="eyebrow">HEART RESCUE / 최종 기록</div><h1 style="font-size:34px">${expired?'전체 8분 종료':'심장 구조대 · 근무 종료'}</h1><p>${esc(state.name)} 의사의 결과</p><div class="score">${points()}<small style="font-size:18px;color:var(--muted)"> / 2,200점</small></div><p><b>구조 ${saved}/2명</b> · 정답 ${correct}/12 · 소요 ${elapsed.toFixed(1)}초</p><p class="small">순위: 총점 높은 순 → 구조 인원 많은 순 → 전체 소요시간 짧은 순</p><div class="missions">${stages.map((s,i)=>{const r=state.records[i];return `<div class="card"><span class="num">0${i+1}</span><b>${s.title}</b><p>${r?({saved:'생존',dead:'사망',complete:'완료',timeout:'시간 초과'}[r.status]):'미진행'}</p><b>${r?r.score:0}점</b><small>${r?`정답 ${r.correct}/3 · ${r.elapsed.toFixed(1)}초`:''}</small></div>`;}).join('')}</div><label for="recordCode">교사에게 보여 줄 결과 코드</label><input class="name" style="max-width:100%;font-size:14px" id="recordCode" readonly value="${esc(resultCode())}"><button id="copyRecord">결과 코드 복사</button><span id="copyStatus" class="small" role="status"></span><details><summary>배운 개념·오답 확인</summary>${stages.map((s,st)=>`<div class="review"><b>${s.title}</b><p>${s.learn}</p>${state.answers.filter(a=>a.stage===st&&!a.ok).map(a=>`<p class="small">${s.qs[a.q][0]}<br>정답: ${s.qs[a.q][1][s.qs[a.q][2]]}</p>`).join('')}</div>`).join('')}</details><button id="restart" class="primary">새 판 준비 ↻</button> <button id="teacherBoard">교사용 점수판</button><p class="small">교사에게 이 화면을 보여 주세요. 결과는 자동 전송되지 않습니다.</p></div></section>`+footer();bindHeader();document.getElementById('restart').onclick=showHome;document.getElementById('teacherBoard').onclick=board;document.getElementById('copyRecord').onclick=()=>{const input=document.getElementById('recordCode'),msg=document.getElementById('copyStatus');input.focus();input.select();if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(input.value).then(()=>msg.textContent=' 복사했습니다.').catch(()=>msg.textContent=' 코드를 길게 눌러 복사하세요.');}else msg.textContent=' 선택한 코드를 길게 눌러 복사하세요.';};window.scrollTo(0,0);}
function board(){state.screen='board';stopClock();root.innerHTML=header()+`<section class="result card"><h1 style="font-size:30px">교사용 점수판</h1><p>결과 화면에서 확인한 코드를 학생별로 한 줄씩 붙여넣으세요. 기기 간 자동 수집은 하지 않습니다.</p><label for="codes">이름 | 점수 | 구조 인원 | 소요 초</label><textarea id="codes" rows="8" placeholder="07 하린 | 1890 | 2 | 286.5&#10;12 다온 | 1620 | 1 | 301.2"></textarea><button id="rank" class="primary">순위 계산</button><div id="ranking" aria-live="polite"></div><button id="backHome">시작 화면으로</button></section>`+footer();bindHeader();document.getElementById('backHome').onclick=showHome;document.getElementById('rank').onclick=()=>{let invalid=0;const rows=document.getElementById('codes').value.split(/\n/).filter(x=>x.trim()).map(x=>{const v=x.split('|').map(x=>x.trim());if(v.length!==4||!v[0]||v.slice(1).some(x=>x==='')||!v.slice(1).every(x=>Number.isFinite(Number(x)))||+v[1]<0||+v[1]>2200||!Number.isInteger(+v[1])||![0,1,2].includes(+v[2])||+v[3]<0||+v[3]>480){invalid++;return null;}return {name:v[0],score:+v[1],saved:+v[2],time:+v[3]};}).filter(Boolean).sort((a,b)=>b.score-a.score||b.saved-a.saved||a.time-b.time);let rank=0;document.getElementById('ranking').innerHTML=`<p class="small">${rows.length}명 · 제외한 형식 오류 ${invalid}줄 · 같은 기록은 공동 순위</p><div style="overflow:auto"><table><thead><tr><th>순위</th><th>이름</th><th>점수</th><th>구조</th><th>시간</th></tr></thead><tbody>${rows.map((r,i)=>{if(i===0||r.score!==rows[i-1].score||r.saved!==rows[i-1].saved||r.time!==rows[i-1].time)rank=i+1;return `<tr><td>${rank}</td><td>${esc(r.name)}</td><td>${r.score}</td><td>${r.saved}명</td><td>${r.time}초</td></tr>`;}).join('')}</tbody></table></div>`;};}
showHome();
})();
</script></body></html>
