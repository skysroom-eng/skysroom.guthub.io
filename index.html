let state={name:'하린',stage:0,q:0,answers:[],screen:'home',tab:'echo',selected:false,flow:0,contract:false};
let sound=false,audio=null,master=null,loop=null,mode='monitor',volume=.25;const root=document.getElementById('game');
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function getAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;if(!audio){audio=new AC();master=audio.createGain();master.gain.value=volume;master.connect(audio.destination);}if(audio.state==='suspended')audio.resume().catch(()=>{sound=false;updateSound();});return true;}catch(e){sound=false;return false;}}
function tone(f,t,d,v){if(!audio||!sound||document.hidden)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.7,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);o.onended=()=>{o.disconnect();g.disconnect();};}
function beat(){if(!sound||!audio||document.hidden)return;const t=audio.currentTime;if(mode==='heart'){tone(95,t,.13,.45);tone(70,t+.22,.11,.32);}else{tone(880,t,.08,.12);}}
function startLoop(){clearInterval(loop);loop=null;if(sound&&getAudio()){beat();loop=setInterval(beat,833);}}
function updateSound(){const b=document.getElementById('sound');if(b){b.textContent=sound?'♫ 소리 끄기':'♪ 소리 켜기';b.setAttribute('aria-pressed',String(sound));}const note=document.getElementById('audioStatus');if(note)note.textContent=sound?'학습용 합성음 재생 중':'소리는 버튼을 눌러 켤 수 있어요.';}
function toggleSound(){sound=!sound;if(sound){if(!getAudio())sound=false;startLoop();}else{clearInterval(loop);loop=null;if(audio)audio.suspend().catch(()=>{});}updateSound();}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(loop);if(audio)audio.suspend().catch(()=>{});}else if(sound){getAudio();startLoop();}});window.addEventListener('pagehide',()=>{clearInterval(loop);if(audio)audio.suspend().catch(()=>{});});
function header(){return `<header class="top"><div><div class="logo"><span>ER</span> CODE</div><div class="small">심장의 비밀 · 중학교 2학년</div></div><div class="controls"><button id="sound" aria-pressed="${sound}">${sound?'♫ 소리 끄기':'♪ 소리 켜기'}</button><label><span class="sr">소리 종류</span><select id="soundMode"><option value="monitor" ${mode==='monitor'?'selected':''}>모니터 · 삐</option><option value="heart" ${mode==='heart'?'selected':''}>심장 · 두근두근</option></select></label><label class="volume">음량 <input id="volume" type="range" min="0" max="100" value="${volume*100}" aria-label="음량"></label></div></header>`;}
function footer(){return `<footer class="footer">이 게임은 심장의 구조와 기능을 배우는 학습용 체험입니다. 인물·상황은 가상이며 실제 진단이나 처치를 연습하는 게임은 아닙니다.<details><summary>자료 출처와 이용 안내</summary><p>초음파: CardioNetworks / Vdbilt, <a href="${ECHO_PAGE}" target="_blank" rel="noopener">A4C normal</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. 원본 영상의 공개 미리보기 정지 사진을 표시합니다. 사진 자체는 수정하지 않았습니다.</p><p>CT: Mikael Häggström, <a href="${CT_PAGE}" target="_blank" rel="noopener">Normal thorax, axial plane (60)</a>, <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0 1.0</a>. 공개된 실제 검사 사진이며 수정하지 않았습니다.</p><p>실제 검사 사진은 인터넷으로 불러옵니다. 두 자료는 서로 다른 공개 자료이며, 게임 속 지우의 검사가 아닙니다. 인물 그림: AI 생성. 소리와 파형: 학습용 합성·모식 표현.</p><p>학습 내용 참고: <a href="https://www.nhlbi.nih.gov/health/heart/blood-flow" target="_blank" rel="noopener">미국 국립심장·폐·혈액연구소, 심장의 혈액 흐름</a>.</p></details></footer>`;}
function bindHeader(){document.getElementById('sound').onclick=toggleSound;document.getElementById('soundMode').onchange=e=>{mode=e.target.value;if(sound)startLoop();};document.getElementById('volume').oninput=e=>{volume=Number(e.target.value)/100;if(master)master.gain.setTargetAtTime(volume,audio.currentTime,.05);};}
function showHome(){state.screen='home';root.innerHTML=header()+`<section class="hero"><div><div class="eyebrow">HEART LAB / 오늘의 과학 미션</div><h1>작은 심장 속,<br><span style="color:var(--mint)">놀라운 여행.</span></h1><p>당신은 여의사 <b>하린</b>입니다.<br>간호사 <b>다온</b>과 함께 지우에게<br>심장의 구조와 기능을 알려 주세요.</p><div><span class="tag">4개 미션 · 16문제</span><span class="tag">약 15~20분</span><span class="tag">시간 제한 없음</span></div><label for="name" class="small">여의사 이름을 바꿀 수 있어요</label><input id="name" class="name" maxlength="12" value="${esc(state.name)}" placeholder="하린"><button class="primary" id="start">검사실 탐험 시작 →</button><p class="small">틀려도 괜찮아요. 설명을 읽고 끝까지 배워요.<br>소리는 위쪽 ‘소리 켜기’를 눌러 주세요.</p></div><div><img class="heroart" src="${ART}" alt="흰 가운을 입은 여의사 하린에게 태블릿을 든 간호사 다온이 말을 거는 모습"><div class="roles"><b>하린 · 여의사</b><span>다온 · 간호사</span></div></div></section><section class="missions">${stages.map((s,i)=>`<div class="card"><span class="num">MISSION 0${i+1}</span><b>${s.title}</b><span class="small">${s.brief}</span></div>`).join('')}</section>`+footer();bindHeader();document.getElementById('start').onclick=()=>{state.name=document.getElementById('name').value.trim()||'하린';state.stage=0;state.q=0;state.answers=[];intro();};}
function cast(){return `<div class="scene"><img src="${ART}" alt="여의사와 간호사가 검사실에서 대화하는 그림"><div class="roles"><b>${esc(state.name)} · 여의사</b><span>다온 · 간호사</span></div></div>`;}
function intro(){state.screen='intro';state.tab=stages[state.stage].tab;state.flow=0;const s=stages[state.stage];root.innerHTML=header()+`<div class="eyebrow">MISSION 0${state.stage+1} / 04</div><h2>${s.title}</h2><section class="layout"><div>${cast()}</div><div class="card"><div class="bubble"><span class="speaker">다온 간호사 → ${esc(state.name)} 의사</span><p>${s.nurse}</p></div><div class="bubble doctor"><span class="speaker">${esc(state.name)} 의사</span><p>${s.doctor}</p></div><p class="small">관찰 자료를 살펴본 뒤 4문제를 해결해요. 한 문제당 10점이며, 오답에도 설명이 제공됩니다.</p><button id="begin" class="primary">함께 알아보기 →</button></div></section>`+footer();bindHeader();document.getElementById('begin').onclick=()=>{state.q=0;question();};window.scrollTo(0,0);}
function monitor(){return `<div class="monitor"><div class="monitorHead"><span class="small">박동 모니터 · 학습용 모식도</span><span class="bpm">72 <small style="font-size:12px">회/분</small></span></div><svg viewBox="0 0 600 60" role="img" aria-label="규칙적인 심장 박동을 표현한 학습용 파형"><path class="wave" d="M0 35 H50 Q60 22 70 35 H95 L105 43 L115 5 L125 53 L135 35 H170 Q185 12 200 35 H250 Q260 22 270 35 H295 L305 43 L315 5 L325 53 L335 35 H370 Q385 12 400 35 H450 Q460 22 470 35 H495 L505 43 L515 5 L525 53 L535 35 H570 Q585 12 600 35"/></svg><div class="small" id="audioStatus">${sound?'학습용 합성음 재생 중':'소리는 버튼을 눌러 켤 수 있어요.'}</div><div class="small">수치와 파형은 예시이며 실제 검사 기록이 아닙니다.</div></div>`;}
function study(){return `<aside class="card study"><div class="eyebrow">OBSERVATION DESK</div><h3>관찰하고 찾아보기</h3><div class="tabs" role="group" aria-label="관찰 자료 선택">${[['echo','초음파'],['ct','CT 사진'],['model','심장 모형'],['flow','순환 경로']].map(([id,t])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}" aria-pressed="${state.tab===id}">${t}</button>`).join('')}</div><div id="viewer" class="viewer"></div>${monitor()}</aside>`;}
function bindStudy(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b));});viewer();});viewer();}
function viewer(){const el=document.getElementById('viewer');if(!el)return;
if(state.tab==='echo'||state.tab==='ct'){const echo=state.tab==='echo';el.innerHTML=`<span class="tag">실제 공개 검사 자료 · 정지 사진</span><img class="medical" id="medimage" src="${echo?ECHO_IMG:CT_IMG}" alt="${echo?'정상 심장의 네 방을 보여 주는 실제 초음파 정지 사진':'가슴을 가로로 자른 단면을 보여 주는 실제 CT 사진'}" referrerpolicy="no-referrer"><p id="medstatus" class="loadnote" role="status">사진을 불러오는 중입니다. 연결이 느리면 아래의 관찰 안내나 심장 모형을 먼저 살펴보세요.</p><h3 style="margin-top:15px">${echo?'관찰: 심장 속 빈 공간과 벽':'관찰: 가슴 속 기관의 위치'}</h3><p>${echo?'검은 공간과 그 둘레의 밝은 벽을 찾아보세요. 초음파는 심장 벽과 판막의 움직임을 관찰하는 데 사용합니다. 이곳에는 한 순간의 사진을 표시했습니다.':'CT는 몸속을 얇은 단면으로 보여 줍니다. 가슴 양쪽의 어두운 부분은 공기가 많은 폐이고, 가운데에는 심장과 큰 혈관 등이 있습니다.'}</p><p class="legend">${echo?'검사 각도에 따라 보이는 방향이 달라요. 심장 모형과 위아래·좌우가 같지 않을 수 있습니다.':'이 자료는 폐를 잘 보이게 한 사진입니다. 이 사진만으로 심장 네 방이나 판막 기능을 판단하지 않아요.'}</p><p class="legend">게임 속 환자의 검사 결과가 아닌 학습용 참고 자료입니다.</p><a class="small" href="${echo?ECHO_PAGE:CT_PAGE}" target="_blank" rel="noopener">${echo?'원본 초음파 영상과 출처 보기 ↗':'원본 CT 사진과 출처 보기 ↗'}</a>`;const img=document.getElementById('medimage'),note=document.getElementById('medstatus');const loaded=()=>{note.hidden=true;};const failed=()=>{img.hidden=true;note.hidden=false;note.textContent='인터넷 연결 또는 제공 사이트 제한으로 사진을 불러오지 못했어요. 원본 링크를 열거나 심장 모형 탭에서 계속 학습할 수 있어요.';};img.onload=loaded;img.onerror=failed;if(img.complete){if(img.naturalWidth)loaded();else failed();}return;}
if(state.tab==='model'){el.innerHTML=`<div class="small">정면에서 바라본 단순 모형 · 실제 모양과 크기는 다름<br>화면 왼쪽 = 몸의 오른쪽 / 화면 오른쪽 = 몸의 왼쪽</div><div id="pump" class="pump"><div class="chambers">${[['우심방','온몸에서 받기','blue'],['좌심방','폐에서 받기','left'],['우심실','폐로 보내기','blue'],['좌심실','온몸으로 보내기','left']].map(([n,t,c],i)=>`<button class="chamber ${c}" data-chamber="${i}"><strong>${n}</strong><small>${t}</small></button>`).join('')}</div></div><div class="valve">같은 쪽 심방 ↓ 판막 ↓ 심실</div><p id="chamberInfo" class="hint" aria-live="polite">네 방을 각각 눌러 역할을 확인해 보세요.</p><button id="pumpButton">수축·이완 모형 관찰</button><p id="pumpInfo" class="small" aria-live="polite">전체 크기 변화는 수축·이완을 단순하게 표현한 것입니다.</p><p class="legend">파랑: 산소가 상대적으로 적은 혈액 / 분홍: 산소가 상대적으로 많은 혈액. 실제 혈액은 모두 붉은 계열입니다.</p>`;const infos=['대정맥을 통해 온몸에서 돌아온 혈액을 받아 우심실로 보냅니다.','폐정맥을 통해 폐에서 돌아온 혈액을 받아 좌심실로 보냅니다.','혈액을 폐동맥으로 내보내 폐로 보냅니다.','혈액을 대동맥으로 내보내 온몸으로 보냅니다. 벽이 우심실보다 두껍습니다.'];document.querySelectorAll('[data-chamber]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-chamber]').forEach(x=>x.classList.toggle('selected',x===b));document.getElementById('chamberInfo').textContent=infos[+b.dataset.chamber];});state.contract=false;document.getElementById('pumpButton').onclick=()=>{state.contract=!state.contract;document.getElementById('pump').classList.toggle('contract',state.contract);document.getElementById('pumpInfo').textContent=state.contract?'수축: 심실 근육이 오므라들며 혈액을 동맥으로 내보냅니다.':'이완: 심실 근육이 풀리며 심실에 혈액이 들어옵니다.';};return;}
el.innerHTML=`<h3>혈액 한 방울을 따라가요</h3><p class="small">온몸에서 출발해 폐와 심장을 지나 돌아옵니다. 한 칸씩 눌러 관찰하세요.</p><div class="flowlist">${route.map((n,i)=>`<span class="${i===state.flow?'on':''}">${i+1}. ${n}${i<route.length-1?' →':''}</span>`).join('')}</div><p class="hint" aria-live="polite">${flowDescription(state.flow)}</p><button id="flowNext" class="primary">${state.flow===10?'처음부터 관찰 ↻':'다음 위치로 →'}</button><p class="legend">폐순환: 우심실 → 폐 → 좌심방<br>온몸순환: 좌심실 → 온몸 → 우심방<br>동맥은 심장에서 나가는 혈관, 정맥은 심장으로 들어오는 혈관입니다.</p>`;document.getElementById('flowNext').onclick=()=>{state.flow=(state.flow+1)%route.length;viewer();};}
function flowDescription(i){return ['온몸의 조직에 산소를 전달한 혈액이 심장으로 돌아갑니다.','대정맥: 온몸에서 심장으로 돌아오는 길입니다.','우심방: 온몸에서 돌아온 혈액을 받습니다.','우심실: 혈액을 폐로 밀어 보냅니다.','폐동맥: 산소가 상대적으로 적은 혈액이 폐로 갑니다.','폐의 모세혈관: 공기에서 산소를 받고 이산화 탄소를 내보냅니다.','폐정맥: 산소가 많아진 혈액이 심장으로 돌아옵니다.','좌심방: 폐에서 돌아온 혈액을 받습니다.','좌심실: 혈액을 온몸으로 힘차게 내보냅니다.','대동맥: 혈액이 온몸으로 나가는 큰 길입니다.','온몸의 모세혈관: 조직에 산소와 영양소 등을 전달합니다. 여행은 다시 이어집니다.'][i];}
function question(){state.screen='question';state.selected=false;const s=stages[state.stage],q=s.qs[state.q];root.innerHTML=header()+`<div class="eyebrow">MISSION 0${state.stage+1} / ${s.title}</div><div class="progress" aria-label="전체 16문제 중 ${state.stage*4+state.q+1}번째">${Array.from({length:16},(_,i)=>`<i class="${i<state.stage*4+state.q?'done':i===state.stage*4+state.q?'current':''}"></i>`).join('')}</div><section class="layout"><div class="story">${cast()}<div class="bubble"><span class="speaker">다온 간호사 → ${esc(state.name)} 의사 · 질문 ${state.q+1}/4</span><h2 id="questionTitle" tabindex="-1" style="margin:8px 0 0">${q[0]}</h2></div><p class="small">자료를 보고 답해도 좋아요. 휴대전화에서는 아래로 내려 관찰 자료를 확인하세요.</p><div class="options">${q[1].map((t,i)=>`<button class="option" data-answer="${i}">${String.fromCharCode(65+i)}. ${t}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></div>${study()}</section>`+footer();bindHeader();bindStudy();document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));window.scrollTo(0,0);}
function answer(i){if(state.selected)return;state.selected=true;const q=stages[state.stage].qs[state.q],ok=i===q[2];state.answers.push({stage:state.stage,q:state.q,choice:i,ok:ok});document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(+b.dataset.answer===q[2])b.classList.add('correct');else if(+b.dataset.answer===i)b.classList.add('wrong');});if(sound&&audio){tone(ok?660:330,audio.currentTime,.12,.16);if(ok)tone(880,audio.currentTime+.14,.12,.13);}document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'retry'}"><b>${ok?'✓ 맞았어요! +10점':'다시 알아보면 괜찮아요.'}</b><p class="small" style="color:inherit">정답: ${q[1][q[2]]}</p><div class="speaker">${esc(state.name)} 의사의 설명</div><p>${q[3]}</p></div><button class="primary" id="next">${state.q===3?'미션 정리 →':'다음 질문 →'}</button>`;document.getElementById('next').onclick=()=>{if(state.q===3)stageEnd();else{state.q++;question();}};}
function stageEnd(){state.screen='stageEnd';const s=stages[state.stage],n=state.answers.filter(a=>a.stage===state.stage&&a.ok).length;root.innerHTML=header()+`<section class="result card"><div class="badge">✦</div><div class="eyebrow">MISSION 0${state.stage+1} COMPLETE</div><h1 style="font-size:32px">${s.title} · 탐험 완료</h1><p>첫 답 정답 ${n}/4 · ${n*10}점</p><div class="bubble doctor"><span class="speaker">${esc(state.name)} 의사 · 오늘의 핵심</span><p>${s.learn}</p></div><div class="bubble"><span class="speaker">다온 간호사</span><p>좋아요. 배운 내용을 한 문장으로 말해 보고 다음으로 가 볼까요?</p></div><button id="continue" class="primary">${state.stage===3?'최종 학습 기록 보기':'다음 미션 →'}</button></section>`+footer();bindHeader();document.getElementById('continue').onclick=()=>{if(state.stage===3)results();else{state.stage++;intro();}};window.scrollTo(0,0);}
function results(){state.screen='results';const correct=state.answers.filter(a=>a.ok).length,missed=state.answers.filter(a=>!a.ok);root.innerHTML=header()+`<section class="result"><div class="card"><div class="eyebrow">HEART EXPLORER / 학습 완료</div><h1 style="font-size:34px">심장 탐험을 마쳤어요!</h1><p>${esc(state.name)} 의사와 다온 간호사가 지우의 궁금증을 함께 풀었습니다.</p><div class="score">${correct*10}<small style="font-size:18px;color:var(--muted)"> / 160점</small></div><p>첫 답 정답 ${correct}/16 · 네 미션 모두 학습 완료</p><div class="missions">${stages.map((s,i)=>`<div class="card"><span class="num">0${i+1}</span><b>${s.title}</b>${state.answers.filter(a=>a.stage===i&&a.ok).length}/4</div>`).join('')}</div><h3>지우에게 설명해 주세요</h3><p>① 심방과 심실은 어떤 일을 하나요?<br>② 판막이 없다면 혈액은 어떻게 될까요?<br>③ 폐와 온몸을 도는 혈액의 길을 말해 보세요.</p><details><summary>핵심 정리 펼치기</summary>${stages.map(s=>`<p>${s.learn}</p>`).join('')}</details><button id="restart" class="primary">처음부터 다시 탐험 ↻</button></div><h2 style="margin-top:24px">${missed.length?'한 번 더 살펴볼 개념':'모든 첫 답이 정확했어요!'}</h2>${missed.map(a=>{const q=stages[a.stage].qs[a.q];return `<div class="review"><b>${q[0]}</b><p class="small">선택한 답: ${q[1][a.choice]}<br>정답: ${q[1][q[2]]}</p><p>${q[3]}</p></div>`;}).join('')}<div class="card" style="margin-top:20px"><h3>자유롭게 다시 관찰하기</h3>${study()}</div></section>`+footer();bindHeader();bindStudy();document.getElementById('restart').onclick=showHome;window.scrollTo(0,0);}
showHome();
})();
</script></body></html>
