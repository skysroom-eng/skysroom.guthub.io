<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ER CODE : 심장을 살려라</title>
<style>
:root{--navy:#071321;--panel:#0c2034;--line:#315b7a;--cyan:#63d9ff;--red:#ff4f63;--green:#55e39b;--gold:#ffd56a}
*{box-sizing:border-box} body{margin:0;background:#030912;color:#f5fbff;font-family:Arial,"Noto Sans KR",sans-serif}
#game{min-height:100vh;background:radial-gradient(circle at 50% 0,#173451,#030912 65%);padding:12px}
.shell{max-width:1180px;margin:auto;border:1px solid #27465e;border-radius:20px;overflow:hidden;background:#071321;box-shadow:0 20px 60px #0008}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 16px;background:#091a2a;border-bottom:1px solid #29465d;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:1px}.brand b{color:var(--red)}.stats{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:13px}
.pill{background:#102a40;border:1px solid #315875;border-radius:9px;padding:7px 10px}.pill strong{color:var(--cyan)}
.sound{border:1px solid #406781;background:#102a40;color:white;border-radius:9px;padding:8px 11px;min-height:40px}
.scene{position:relative;min-height:660px;background-size:cover;background-position:center;display:flex;align-items:flex-end}
.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00101d20 20%,#00101d80 70%,#00101de8)}
.content{position:relative;z-index:2;width:100%;padding:24px}
.startbox{max-width:600px;margin:70px auto;background:#071321e8;border:1px solid #4a6b82;border-radius:18px;padding:28px;text-align:center}
.startbox h1{font-size:44px;margin:0}.startbox h1 b{color:var(--red)}.startbox p{line-height:1.65;color:#d1e2ef}
.name{width:min(360px,95%);font-size:18px;padding:14px;border-radius:10px;border:1px solid #4b6b82;background:#06111d;color:white;text-align:center}
.btn{border:1px solid #47708e;background:#123956;color:#fff;border-radius:12px;padding:14px 18px;min-height:52px;font-weight:800;font-size:16px;cursor:pointer}
.btn.primary{background:linear-gradient(#ff5d70,#d92f47);border-color:#ff8391}.btn:hover{filter:brightness(1.1)}
.dialogue{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:end}
.doctorCard{background:#071321e8;border:1px solid #41637b;border-radius:16px;padding:15px;text-align:center}
.doctorIcon{font-size:70px}.doctorCard b{color:#9be7ff}
.talk{background:#f7fbff;color:#102030;border-radius:16px;padding:18px 20px;border:3px solid #d7e8f4;box-shadow:0 10px 30px #0007}
.talk .who{display:inline-block;background:#0b3a68;color:white;border-radius:8px;padding:5px 9px;font-weight:800;margin-bottom:9px}
.talk p{font-size:20px;line-height:1.55;margin:0}
.vitals{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}.v{background:#041019dd;border:1px solid #37627c;border-radius:9px;padding:7px 10px}.v b{color:#66ef9a}
.timerbar{height:9px;background:#162d40;border-radius:10px;overflow:hidden;margin:12px 0}.timerbar>div{height:100%;background:linear-gradient(90deg,#54e2a2,#ffd75f,#ff5265);transition:width .25s}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.opt{background:#0d3a61e8;border:2px solid #63b7ef;color:white;border-radius:12px;padding:15px;text-align:left;font-size:17px;font-weight:800;min-height:58px}
.opt:hover{background:#15517f}.feedback{margin-top:12px;padding:12px;border-radius:10px;font-weight:800}.good{background:#0b593f;color:white}.bad{background:#711f31;color:white}
.stageIntro{max-width:720px;background:#06121de8;border:1px solid #436681;border-radius:18px;padding:24px;margin:250px auto 20px;text-align:center}
.stageIntro h2{font-size:30px;margin:0 0 8px}.stars{color:#ffd56a;font-size:25px;letter-spacing:4px}
.result{max-width:650px;margin:250px auto 0;background:#06121dec;border:1px solid #466b85;border-radius:18px;padding:24px;text-align:center}.result h2{font-size:34px;margin:0 0 10px}
.scorebig{font-size:46px;color:var(--gold);font-weight:900}.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}.mini{background:#10283b;border-radius:10px;padding:10px}
.rule{font-size:13px;color:#bad0df}.danger{color:#ff8290}.ok{color:#6ef0a5}
@media(max-width:720px){.scene{min-height:720px}.dialogue{grid-template-columns:1fr}.doctorCard{display:none}.options{grid-template-columns:1fr}.talk p{font-size:17px}.content{padding:14px}.breakdown{grid-template-columns:1fr 1fr}.startbox h1{font-size:34px}}
</style>
</head>

function tone(f,d=.09,type="sine",v=.035,delay=0){if(!sound)return;ctx();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.02)}
function sfx(kind){if(kind==="ok"){tone(650);tone(900,.12,"sine",.04,.08)}else if(kind==="bad"){tone(190,.18,"sawtooth",.04);tone(130,.22,"sawtooth",.035,.12)}else if(kind==="dead"){[900,650,450,220].forEach((f,i)=>tone(f,.18,"square",.03,i*.15))}else{[523,659,784,1047].forEach((f,i)=>tone(f,.13,"sine",.04,i*.09))}}
function top(){return `<div class="top"><div class="brand"><b>ER</b> CODE · 심장을 살려라</div><div class="stats"><span class="pill">의사 <strong>${S.name||"-"}</strong></span><span class="pill">총점 <strong>${S.total}</strong></span><span class="pill">재도전 <strong>${S.retries.reduce((a,b)=>a+b,0)}</strong></span><button class="sound" id="snd">${sound?"🔊":"🔇"} 사운드</button></div></div>`}
function bindTop(){document.getElementById("snd")?.addEventListener("click",()=>{sound=!sound;if(sound)tone(700);renderCurrent()})}
function start(){
 clearInterval(timer);
 root.innerHTML=`<div class="shell">${top()}<section class="scene" style="background-image:url('${ART.title}')"><div class="content"><div class="startbox"><h1><b>ER CODE</b><br>심장을 살려라</h1><p>당신은 응급실 의사입니다.<br>4명의 환자를 진단하며 심장의 구조와 혈액순환을 익혀보세요.</p><input class="name" id="nm" maxlength="10" placeholder="의사 이름을 입력하세요"><p><button class="btn primary" id="go">응급실 근무 시작</button></p><div class="rule">1단계는 1문제만 맞혀도 생존 · 4단계는 한 문제라도 틀리면 사망<br>빠른 판단일수록 높은 점수 · 사망 후 재도전할 때마다 감점</div></div></div></section></div>`;
 bindTop(); document.getElementById("go").onclick=()=>{S={name:document.getElementById("nm").value.trim()||"학생",stage:0,q:0,correct:0,total:0,stageScore:0,retries:[0,0,0,0],stageScores:[0,0,0,0],alive:true};ctx();intro()}
}
function intro(){
 clearInterval(timer);let st=STAGES[S.stage];
 root.innerHTML=`<div class="shell">${top()}<section class="scene" style="background-image:url('${ART[st.img]}')"><div class="content"><div class="stageIntro"><div class="stars">${"★".repeat(st.stars)}${"☆".repeat(4-st.stars)}</div><h2>STAGE ${S.stage+1} · ${st.name}</h2><p>제한시간 ${st.limit}초 · 생존 조건: ${st.death?"4문제 전부 정답 (오답 즉시 사망)":`${st.need}문제 이상 정답`}</p><p class="rule">현재 재도전 ${S.retries[S.stage]}회 · 재도전 1회마다 80점 감점</p><button class="btn primary" id="case">환자 진료 시작</button></div></div></section></div>`;
 bindTop();document.getElementById("case").onclick=()=>{S.q=0;S.correct=0;S.stageScore=0;left=st.limit;question()}
}
function question(feedback="",good=null){
 clearInterval(timer);let st=STAGES[S.stage],q=st.q[S.q];
 if(!q){finishStage();return}
 root.innerHTML=`<div class="shell">${top()}<section class="scene" style="background-image:url('${ART[st.img]}')"><div class="content"><div class="vitals"><span class="v">HR <b>${110+S.stage*10}</b></span><span class="v">BP <b>${90-S.stage*8}/${60-S.stage*7}</b></span><span class="v">SpO₂ <b>${94-S.stage*4}%</b></span><span class="v">⏱ <b id="clock">${left}</b>s</span></div><div class="timerbar"><div id="bar" style="width:${left/st.limit*100}%"></div></div><div class="dialogue"><div class="doctorCard"><div class="doctorIcon">🧑‍⚕️</div><b>${S.name} 의사</b><p>환자를 살리기 위해 판단하세요.</p></div><div><div class="talk"><span class="who">응급실 간호사</span><p>${q[0]}</p></div>${feedback?`<div class="feedback ${good?"good":"bad"}">${feedback}</div>`:""}<div class="options">${feedback?`<button class="btn primary" id="next">다음 판단 →</button>`:q[1].map((x,i)=>`<button class="opt" data-i="${i}">${i+1}. ${x}</button>`).join("")}</div></div></div></div></section></div>`;
 bindTop();
 if(feedback){document.getElementById("next").onclick=()=>{S.q++;question();};return}
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
 timer=setInterval(()=>{left--;let c=document.getElementById("clock"),bar=document.getElementById("bar");if(c)c.textContent=left;if(bar)bar.style.width=Math.max(0,left/st.limit*100)+"%";if(left<=0){clearInterval(timer);timeout()}},1000)
}
function answer(i){
 clearInterval(timer);let st=STAGES[S.stage],q=st.q[S.q],ok=i===q[2];
 if(ok){S.correct++;let speed=Math.max(0,Math.round(left/st.limit*75));S.stageScore+=100+speed;sfx("ok");question(`✓ 정확한 판단입니다. +${100+speed}점<br>${q[3]}`,true)}
 else{
   S.stageScore-=30;sfx("bad");
   if(st.death){death("4단계에서는 한 번의 오답도 치명적입니다.");return}
   question(`⚠ 잘못된 판단입니다. -30점<br>${q[3]}`,false)
 }
}
function timeout(){let st=STAGES[S.stage];S.stageScore-=50;sfx("bad");if(st.death){death("제한시간이 끝났습니다.");return}question("⏱ 판단이 늦었습니다. -50점",false)}
function finishStage(){
 clearInterval(timer);let st=STAGES[S.stage];
 if(S.correct<st.need){death(`생존에 필요한 정답 수(${st.need}개)에 도달하지 못했습니다.`);return}
 let retryPenalty=S.retries[S.stage]*80;
 let final=Math.max(0,S.stageScore-retryPenalty);
 S.stageScores[S.stage]=final;S.total+=final;sfx("win");
 root.innerHTML=`<div class="shell">${top()}<section class="scene" style="background-image:url('${ART.success}')"><div class="content"><div class="result"><h2 class="ok">STAGE CLEAR!</h2><p>환자의 상태가 안정되었습니다.</p><div class="scorebig">+${final}점</div><p>정답 ${S.correct}/4 · 재도전 감점 -${retryPenalty}점</p><p class="rule">${lesson(S.stage)}</p><button class="btn primary" id="cont">${S.stage===3?"최종 결과 확인":"다음 환자 →"}</button></div></div></section></div>`;
 bindTop();document.getElementById("cont").onclick=()=>{if(S.stage===3)finalResult();else{S.stage++;intro()}}
}
function death(reason){
 clearInterval(timer);sfx("dead");S.retries[S.stage]++;
 root.innerHTML=`<div class="shell">${top()}<section class="scene" style="background-image:url('${ART.fail}')"><div class="content"><div class="result"><h2 class="danger">환자가 사망했습니다.</h2><p>${reason}</p><p>이 스테이지를 다시 도전하면 최종 스테이지 점수에서 <b>80점</b>이 추가로 감점됩니다.</p><div class="scorebig danger">재도전 ${S.retries[S.stage]}회</div><button class="btn primary" id="retry">다시 도전</button></div></div></section></div>`;
 bindTop();document.getElementById("retry").onclick=intro
}
function lesson(i){return ["판막은 혈액의 역류를 막습니다.","대정맥은 온몸의 혈액을 우심방으로 운반합니다.","폐정맥은 폐에서 산소를 얻은 혈액을 좌심방으로 운반합니다.","대동맥은 좌심실에서 나온 혈액을 온몸으로 운반합니다."][i]}
function finalResult(){
 clearInterval(timer);
 let perfect=S.retries.every(x=>x===0)&&S.stageScores.every(x=>x>0);
 let bonus=perfect?300:0;S.total+=bonus;
 root.innerHTML=`<div class="shell">${top()}<section class="scene" style="background-image:url('${ART.final}')"><div class="content"><div class="result"><h2>최종 결과</h2><p>${S.name} 의사의 응급실 근무가 종료되었습니다.</p><div class="scorebig">${S.total}점</div>${perfect?`<p class="ok"><b>PERFECT BONUS +300</b><br>4개 스테이지를 재도전 없이 모두 통과했습니다!</p>`:""}<div class="breakdown">${S.stageScores.map((x,i)=>`<div class="mini">${i+1}단계<br><b>${x}점</b><br><span class="rule">재도전 ${S.retries[i]}</span></div>`).join("")}</div><p class="rule">판막: 역류 방지 · 대정맥: 온몸→우심방 · 폐정맥: 폐→좌심방 · 대동맥: 좌심실→온몸</p><button class="btn primary" id="restart">처음부터 다시</button></div></div></section></div>`;
 bindTop();document.getElementById("restart").onclick=start
}
function renderCurrent(){ if(!S.name)start(); else if(S.q<STAGES[S.stage].q.length)question(); else intro() }
start();
</script>
</body></html>
